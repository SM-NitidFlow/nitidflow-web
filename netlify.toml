# Sitio estático: no hay build, se publica la carpeta tal cual.
[build]
  publish = "."
  command = ""

# La detección de formularios es lo que activa Netlify Forms en el site.
[build.processing]
  skip_processing = false

# El fuente se mantiene legible y comentado; la minificación ocurre al
# publicar, así no hay dos versiones del mismo fichero que mantener.
[build.processing.css]
  minify = true

[build.processing.js]
  minify = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Los assets llevan ?v=fecha en el HTML, así que pueden cachearse fuerte.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML nunca se cachea: es lo que trae las referencias ?v= nuevas.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ============================================================
# Reestructuración de idiomas (29-08-2026)
#   El español pasa a la raíz y el inglés a /en/.
#   301 permanente: traslada a las nuevas URLs la señal que Google
#   ya hubiera acumulado en las antiguas. Sin esto se empieza de cero.
# ============================================================
[[redirects]]
  from = "/es/"
  to = "/"
  status = 301
  force = true
