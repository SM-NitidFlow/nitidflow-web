<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks — NITID Flow</title>
<meta name="description" content="Your message reached NITID Flow.">
<meta name="theme-color" content="#071522">
<link rel="canonical" href="https://nitidflow.com/en/thanks.html">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon-32.png?v=20260927" type="image/png" sizes="32x32">
<link rel="icon" href="/icon-192.png?v=20260927" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260927">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.min.css?v=20260927">
<style>
  .thanks{
    min-height:100svh;
    display:grid; place-items:center;
    padding:var(--pad);
  }
  .thanks__panel{
    max-width:620px; width:100%;
    padding:clamp(32px,4vw,60px);
    border-radius:var(--r-lg);
    text-align:center;
  }
  .thanks__panel .logoclip{ width:clamp(180px,32vw,300px); margin:0 auto 28px; }
  .thanks__panel h1{
    margin:0 0 16px;
    font-family:var(--display); font-weight:800;
    font-size:clamp(1.7rem,4vw,2.6rem);
    line-height:1.1; letter-spacing:-.02em; color:#fff;
  }
  .thanks__panel p{ margin:0 auto 28px; max-width:44ch; color:var(--text-dim); }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="bg__media"
       data-silk
       data-colors="#3d7ba8,#cfe2f0,#f4f1ec"
       data-bg="#071522"
       data-speed="0.35"
       data-layers="4"
       data-amplitude="0.3"
       data-frequency="2"
       data-angle="-12"
       data-softness="0.6"
       data-sheen="0.6"
       data-grain="0.04"></div>
  <div class="bg__scrim"></div>
  <div class="bg__vignette"></div>
</div>

<main class="thanks">
  <div class="panel thanks__panel">
    <span class="logoclip"><img src="/assets/logo.png?v=20260927" alt="NITID Flow"></span>
    <p class="eyebrow" style="margin-bottom:18px">MESSAGE RECEIVED</p>
    <h1>Thanks &mdash; we&rsquo;ve got it.</h1>
    <p>We read every message ourselves and normally reply within one working day. If it&rsquo;s urgent, email <a href="mailto:hello@nitidflow.com" style="color:#fff">hello@nitidflow.com</a> directly.</p>
    <a class="btn" href="/">BACK TO SITE</a>
  </div>
</main>

<script src="/js/silk.min.js" defer></script>
</body>
</html>
